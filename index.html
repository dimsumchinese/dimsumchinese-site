<main class="wrap">
  <h1 data-zh="粵語學習資源庫" data-en="Cantonese Learning Resources">粵語學習資源庫</h1>
  <p class="intro" data-zh="為海外粵語家庭和所有想學廣東話的人整理的免費資源。可按分類瀏覽，或按年齡、程度、技能和形式篩選，也可以用中文或英文搜尋。"
     data-en="Free resources for Cantonese-speaking families abroad and anyone learning Cantonese. Browse by category, filter by age, difficulty, skill and format, or search in English or Chinese.">為海外粵語家庭和所有想學廣東話的人整理的免費資源。可按分類瀏覽，或按年齡、程度、技能和形式篩選，也可以用中文或英文搜尋。</p>

  <div class="layout">
    <aside class="sidebar" aria-label="分類 Categories">
      <a class="donate-btn" href="support.html"><span aria-hidden="true">☕</span> <span data-zh="贊助網站運作" data-en="Support this site">贊助網站運作</span></a>
      <a class="promo" href="#contact">
        <b data-zh="推薦資源給我們" data-en="Suggest a resource">推薦資源給我們</b>
        <span data-zh="一齊建立粵語資源庫 ↗" data-en="Help build this library ↗">一齊建立粵語資源庫 ↗</span>
      </a>
      <nav id="sidebar" class="cat-list"></nav>
    </aside>
    <div class="content">
    <div class="search-wrap main-search">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="q" type="search" autocomplete="off" role="combobox" aria-controls="suggest" aria-expanded="false"
          data-zh-ph="搜尋：兒歌、粵拼、恐龍…" data-en-ph="Search: songs, Jyutping, dinosaurs…" placeholder="搜尋：兒歌、粵拼、恐龍…">
      </label>
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </div>
    <section class="filter-box">
      <div class="row">
        <button id="allBtn" class="fbtn" type="button" data-zh="全部" data-en="All">全部</button>
        <div id="groups" class="row inline"></div>
      </div>
      <div id="opts" class="row opts"></div>
      <div id="active" class="row active"></div>
      <div class="row foot">
        <p id="count" class="count"></p>
        <label class="adult-toggle"><input id="adultChk" type="checkbox">
          <span data-zh="顯示 15+ 內容" data-en="Show 15+ content">顯示 15+ 內容</span></label>
      </div>
    </section>

    <div class="list-head"><h2 id="listTitle"></h2><span id="listCount"></span></div>
    <section id="list" class="grid" aria-live="polite"></section>
    </div>
  </div>

  <section id="contact" class="contact">
    <h2 data-zh="聯絡我們" data-en="Contact us">聯絡我們</h2>
    <p class="intro" data-zh="想推薦新資源、回報失效連結，或者是原作者想更正、移除連結？歡迎留言。"
       data-en="Want to suggest a resource, report a broken link, or are you a creator who wants a link corrected or removed? Send us a message.">想推薦新資源、回報失效連結，或者是原作者想更正、移除連結？歡迎留言。</p>
    <form id="contactForm" class="contact-form" action="https://api.web3forms.com/submit" method="POST" novalidate>
      <!-- ▼ 把 Web3Forms 的 access key 貼在這裡 / paste your Web3Forms access key here -->
      <input type="hidden" name="access_key" value="b1f27232-7b51-4a3d-9666-fdeb99970036">
      <input type="hidden" name="subject" value="DimSumChinese 點心中文：網站新訊息">
      <input type="hidden" name="from_name" value="DimSumChinese 網站">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <div class="f-row">
        <label><span data-zh="名字" data-en="Name">名字</span>
          <input name="name" required maxlength="100" autocomplete="name"></label>
        <label><span data-zh="電郵" data-en="Email">電郵</span>
          <input name="email" type="email" required maxlength="200" autocomplete="email"></label>
      </div>
      <label><span data-zh="類別" data-en="Topic">類別</span>
        <select name="topic">
          <option value="推薦新資源 Suggest a resource" data-zh="推薦新資源" data-en="Suggest a resource">推薦新資源</option>
          <option value="回報失效連結 Broken link" data-zh="回報失效連結" data-en="Report a broken link">回報失效連結</option>
          <option value="原作者：更正或移除 Creator request" data-zh="我是原作者：更正或移除" data-en="I'm a creator: correct or remove">我是原作者：更正或移除</option>
          <option value="合作 Collaboration" data-zh="合作" data-en="Collaboration">合作</option>
          <option value="其他 Other" data-zh="其他" data-en="Other">其他</option>
        </select></label>
      <label><span data-zh="訊息" data-en="Message">訊息</span>
        <textarea name="message" rows="5" required maxlength="5000"></textarea></label>
      <button type="submit" class="send" data-zh="送出" data-en="Send">送出</button>
      <p id="formStatus" class="form-status" role="status"></p>
    </form>
  </section>
</main>
